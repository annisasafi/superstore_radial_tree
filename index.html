<!DOCTYPE html>
<meta charset="utf-8">

<style>

    display: flex;

<body>
<div id="chart"></div>
<script>

{
  const width = 928;
  const height = width;
  const cx = width * 0.5;
  const cy = height * 0.5;
  const radius = Math.min(width, height) / 2 - 120;

  const tree = d3.tree()
      .size([2 * Math.PI, radius])
      .separation((a, b) => (a.parent == b.parent ? 1 : 2) / a.depth);

  const root = tree(d3.hierarchy(data)
      .sort((a, b) => d3.ascending(a.data.name, b.data.name)));

  const svg = d3.select("#chart").append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", [-cx, -cy, width, height])
      .attr("style", "width: 100%; height: auto; font: 12px 'Segoe UI', Arial, sans-serif; background: #0a0e1a; border-radius: 16px;");

  svg.append("g")
      .attr("fill", "none")
      .attr("stroke", "#334155")
      .attr("stroke-opacity", 0.8)
      .attr("stroke-width", 1.2)
    .selectAll()
    .data(root.links())
    .join("path")
      .attr("d", d3.linkRadial()
          .angle(d => d.x)
          .radius(d => d.y));

  svg.append("g")
    .selectAll()
    .data(root.descendants())
    .join("circle")
      .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
      .attr("fill", d => {
        if (!d.parent) return "#00e5a0";
        if (d.depth === 1) return "#fbbf24";
        if (d.depth === 2) return "#34d399";
        if (d.data.name === "Furniture") return "#f97316";
        if (d.data.name === "Technology") return "#60a5fa";
        if (d.data.name === "Office Supplies") return "#a78bfa";
        return "#999";
      })
      .attr("stroke", d => {
        if (!d.parent) return "#00e5a0";
        if (d.depth === 1) return "#fbbf24";
        if (d.depth === 2) return "#34d399";
        if (d.data.name === "Furniture") return "#f97316";
        if (d.data.name === "Technology") return "#60a5fa";
        if (d.data.name === "Office Supplies") return "#a78bfa";
        return "#999";
      })
      .attr("stroke-opacity", 0.3)
      .attr("stroke-width", 6)
      .attr("r", d => {
        if (d.depth === 0) return 10;
        if (d.depth === 1) return 7;
        if (d.depth === 2) return 5;
        return 4;
      });

  svg.append("g")
      .attr("stroke-linejoin", "round")
      .attr("stroke-width", 4)
    .selectAll()
    .data(root.descendants())
    .join("text")
      .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0) rotate(${d.x >= Math.PI ? 180 : 0})`)
      .attr("dy", "0.31em")
      .attr("x", d => d.x < Math.PI === !d.children ? 6 : -6)
      .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
      .attr("paint-order", "stroke")
      .attr("stroke", "#0a0e1a")
      .attr("fill", d => {
        if (!d.parent) return "#00e5a0";
        if (d.depth === 1) return "#fbbf24";
        if (d.depth === 2) return "#34d399";
        if (d.data.name === "Furniture") return "#f97316";
        if (d.data.name === "Technology") return "#60a5fa";
        if (d.data.name === "Office Supplies") return "#a78bfa";
        return "#cbd5e1";
      })
      .attr("font-weight", d => d.depth <= 1 ? "700" : "400")
      .attr("font-size", d => {
        if (d.depth === 0) return "14px";
        if (d.depth === 1) return "13px";
        if (d.depth === 2) return "11px";
        return "10px";
      })
      .text(d => d.data.name);
}
</script>
</body>
